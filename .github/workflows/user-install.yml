name: user-install

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: user-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: README cold install and first launch (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install only the test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest packaging
          python -I -c 'import importlib.util; assert importlib.util.find_spec("invisible_core") is None; assert importlib.util.find_spec("invisible_playwright") is None'
      - name: Linux browser runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libdbus-glib-1-2 libasound2t64
      - name: Run the README installation and browser example
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTEST_ADDOPTS: ''
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -I -m pytest tests/test_release_e2e.py -m e2e \
            --noconftest -p no:invisible_core.testing.world \
            -o pythonpath= -o addopts= -v -rs \
            --junitxml=user-install.xml | tee user-install.txt
      - name: Require every installation assertion to run
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = {
              "test_clean_install_the_way_a_user_does_it",
              "test_the_resolved_playwright_is_inside_the_range_the_package_declares",
              "test_version_command_reports_wrapper_and_binary",
              "test_fetch_against_live_release",
              "test_binary_executes_after_fetch",
              "test_playwright_launch_against_real_site",
              "test_the_published_version_has_a_github_release",
              "test_the_changelog_documents_every_version_it_claims_to_cover",
          }
          cases = ET.parse("user-install.xml").findall(".//testcase")
          passed = {case.attrib["name"] for case in cases if not list(case)}
          missing = required - passed
          assert not missing, f"Installation assertions did not pass: {sorted(missing)}"
          assert not any(case.find(status) is not None
                         for case in cases for status in ("failure", "error", "skipped"))
          with Path("user-install.txt").open("a") as report:
              report.write(f"\nAll {len(required)} installation assertions passed.\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            user-install.xml
            user-install.txt
          if-no-files-found: warn
