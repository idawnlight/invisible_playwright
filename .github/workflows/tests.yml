name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  INVISIBLE_CORE_AUTOFIX: "off"

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned GitHub core and checkout
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(python scripts/core_requirement.py)" -e ".[dev]" hatchling
      - run: python scripts/install_hooks.py
      - name: Check names and duplicate definitions
        run: python -m ruff check --select F821,F811,F601 --no-cache --output-format concise .
      - name: Run the default suite
        run: python -m pytest -q -rs --junitxml=unit.xml
      - name: Require the default suite to run
        run: |
          python - <<'PYTEST_COUNT'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("unit.xml").getroot().iter("testcase"))
          passed = sum(not any(case.find(name) is not None for name in ("skipped", "failure", "error")) for case in cases)
          if passed < 600:
              raise SystemExit(f"only {passed} tests passed; expected at least 600")
          PYTEST_COUNT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.os }}-${{ matrix.python }}
          path: unit.xml
