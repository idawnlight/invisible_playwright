name: pinned Git core

on:
  workflow_call:
    outputs:
      available:
        description: '"true" when the exact core Git tag exists.'
        value: ${{ jobs.probe.outputs.available }}
      pin:
        description: The invisible-core version pinned in pyproject.toml.
        value: ${{ jobs.probe.outputs.pin }}

permissions:
  contents: read

jobs:
  probe:
    name: Verify the pinned core Git tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
      pin: ${{ steps.probe.outputs.pin }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - id: probe
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import runpy
          import subprocess

          requirement = runpy.run_path("scripts/core_requirement.py")["requirement"]()
          url, ref = requirement.split(" @ git+", 1)[1].partition(";")[0].strip().rsplit("@", 1)
          pin = ref.removeprefix("v")
          tag = f"refs/tags/{ref}"
          result = subprocess.run(
              ["git", "ls-remote", "--exit-code", url, tag, tag + "^{}"],
              capture_output=True, text=True, timeout=90)
          if result.returncode not in (0, 2):
              raise SystemExit(f"Git core probe failed: {result.stderr}")
          available = result.returncode == 0
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"pin={pin}\navailable={str(available).lower()}\n")
          if available:
              message = f"Pinned Git core {ref} exists in {url}.\n{result.stdout}"
          else:
              message = f"Pinned Git core {ref} does not exist in {url}; dependent browser jobs are skipped."
              print(f"::warning::{message}")
          print(message)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(message + "\n")
          PYTHON
