# ─────────────────────────────────────────────────────────────────────────────
# e2e-hunt.yml - runs the e2e suite in a LOOP until it catches a hang.
#
# Why it exists. The e2e job hangs in 12% of runs (4 out of 33 between
# 2026-08-01 and 08-13), and the 40-minute ceiling kills the job. At 12% a
# green run proves nothing, and it takes ~18 runs to have a 90% probability
# of seeing one: waiting for it to happen on its own on a PR means waiting
# days and burning someone else's time every time.
#
# And why HERE and not locally, for TWO different reasons depending on the
# `os` input.
#
#   ubuntu-24.04 - the job hang lived there. CLOSED on 2026-08-13 with 36
#   runs (two hunts of 18): zero hangs, zero retries. Stays as a
#   non-regression check.
#
#   windows-latest - a different question, still open: on the dev machine
#   interaction tests produce retries (41 out of 17 runs) and on Linux not
#   even one in 36. But that machine was not idle - whoever was measuring
#   was running on it, and later the owner came back to it - so the
#   comparison is CONFUSED between platform and contention. A dedicated
#   Windows runner separates the two without asking anyone to stay off it
#   for six hours.
#
# Doesn't start on its own: `workflow_dispatch` only. It's not a gate, it's
# an investigation tool, and it must not be added to the required contexts.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e hunt

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs at most (at 12% it takes ~18 for a 90% chance)"
        required: false
        default: "18"
      os:
        description: "Where to hunt. windows-latest answers a DIFFERENT question: are the interaction retries seen on the dev machine the product or contention?"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: hunt (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    # 18 runs of ~6 minutes plus install time. Deliberately generous: the
    # ceiling here must NEVER be the thing that stops the hunt, or we're back
    # to a killed job that explains nothing, which is the original defect.
    timeout-minutes: 300
    # On Windows GitHub runs `run:` blocks with POWERSHELL, not bash, and the
    # first launch on windows-latest died in 5 minutes with a ParserError on
    # the line `if [ "$RUNNER_OS" = "Linux" ]`. The block had been run before
    # shipping it, as the rule requires - but in bash, on the writer's own
    # machine, i.e. with an interpreter different from the target's.
    # Running the block is not enough: it has to run with the runner's SHELL.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ pinned Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(python scripts/core_requirement.py)" ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Check whether this engine publishes the runner's asset
        id: platform
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import platform
          import sys
          from invisible_core.seal import active_seal, normalize_arch

          seal = active_seal()
          arch = normalize_arch(platform.machine())
          supported = any(asset.platform == sys.platform and asset.arch == arch
                          for asset in seal.assets.values())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"available={str(supported).lower()}\n")
          if not supported:
              message = f"{seal.tag} has no {sys.platform}/{arch} asset; browser steps are skipped."
              print(f"::notice::{message}")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(message + "\n")
          PY
      # Linux only: on Windows the browser launches on the runner's desktop,
      # and `firefox-launch-matrix.yml` has shown for months that it really
      # starts there.
      - name: System deps (xvfb + Firefox runtime libs)
        if: steps.platform.outputs.available == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        if: steps.platform.outputs.available == 'true'
        run: |
          set -euo pipefail
          fetch_output="$(python -m invisible_playwright fetch)"
          printf '%s\n' "$fetch_output"
          binary="$(printf '%s\n' "$fetch_output" | tail -n 1)"
          test -f "$binary"
          echo "FF=$binary" >> "$GITHUB_ENV"

      - name: Loop until it catches one
        if: steps.platform.outputs.available == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: evidence/e2e-watchdog.log
        run: |
          set -u
          runs="${{ inputs.runs }}"
          mkdir -p evidence/runs
          # `evidence/` inside the workspace, not RUNNER_TEMP: on Windows that
          # variable contains backslashes and does not cross bash reliably.
          # xvfb only where it exists; on Windows the browser goes to the
          # runner's desktop.
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          captured=0
          for n in $(seq 1 "$runs"); do
            log="evidence/runs/run_$(printf '%02d' "$n").log"
            t0=$(date +%s)
            set +e
            $PRE python -u scripts/run_e2e.py "$FF" > "$log" 2>&1
            code=$?
            set -e
            dur=$(( $(date +%s) - t0 ))
            # A hang is no longer a killed job now: the per-test deadline
            # turns it into a failure, and the banner names it.
            if grep -aq "Timeout" "$log" && grep -aq "Stack of" "$log"; then
              echo "::error::run $n: HANG CAUGHT after ${dur}s"
              echo "--- the last test that spoke ---"
              grep -aE "::.*(PASSED|SKIPPED|FAILED)" "$log" | tail -3
              echo "--- the stack ---"
              sed -n '/Timeout/,$p' "$log" | head -60
              captured=1
              break
            fi
            echo "run $n/$runs: exit=$code, ${dur}s"
          done
          if [ "$captured" = "0" ]; then
            echo "::warning::$runs runs, no hang caught."
            echo "If the rate here is the same 12%, the probability of this"
            echo "outcome is $(python -c "print(round(100*0.88**$runs))")%, so this is not proof"
            echo "the defect is not there: it is a measurement of the rate with this sample."
          fi
          # The step fails ONLY if it caught one: that way red means "found",
          # not "broken", and red is what you go read.
          exit "$captured"

      - name: Upload all the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hunt-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs
            evidence/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14
