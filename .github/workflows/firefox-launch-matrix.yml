name: firefox-launch-matrix

# Cross-Windows-edition smoke for the SEALED binary, on every Windows runner
# GitHub offers, from a fresh checkout.
#
# HISTORY, and what this can no longer do. It was written for issue #22 (a SxS
# mismatch on Win11 build 26200) and ran the reporter snippet against firefox-7.
# It cannot: a sealed invisible-core serves the sealed tag and refuses every
# other one, so `fetch firefox-7` is a SealMismatch by design now.
#
# It was also SILENTLY WRONG from the seal landing to 2026-07-26: the verify
# step rebuilt the cache path by hand as Cache/firefox-7/firefox.exe while the
# cache is content-keyed (Cache/<tag>_<version>_<buildid>/), so every cell failed
# with NOT FOUND - a failure that looked exactly like the bug under investigation
# and was not. Nine red cells read as "reproduced everywhere". The path now comes
# from the last line of `fetch`, the command that verifies the sealed tree.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firefox-launch-matrix.yml'

# Least privilege: this smoke matrix only checks out the repo and launches
# firefox.exe, so it needs nothing but read access to the contents. Without an
# explicit block the token would default to the repo's broader permissions.
permissions:
  contents: read

jobs:
  # The core Git tag must exist. Browser steps also require a Windows asset.
  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  smoke:
    name: launch (${{ matrix.os }}, py${{ matrix.python }})
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-latest]
        # This is a "does firefox.exe launch" smoke test across Windows versions;
        # the Python version does not change the answer, so one is enough. That
        # takes this all-Windows (2x-cost) matrix from 9 jobs to 3.
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Windows edition + build info
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Caption    : $($os.Caption)"
          Write-Host "BuildNumber: $($os.BuildNumber)"
          Write-Host "OSArch     : $($os.OSArchitecture)"
          Write-Host "Edition    : $((Get-CimInstance Win32_OperatingSystem).OperatingSystemSKU)"
          Write-Host "---"
          Write-Host "VC++ Redistributables installed:"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*Visual C++*Redist*' } |
            Select-Object DisplayName, DisplayVersion |
            Format-Table -AutoSize

      - name: Install package from this commit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(python scripts/core_requirement.py)" .

      - name: Check whether this engine publishes a Windows asset
        id: platform
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import platform
          import sys
          from invisible_core.seal import active_seal, normalize_arch

          seal = active_seal()
          arch = normalize_arch(platform.machine())
          supported = any(asset.platform == sys.platform and asset.arch == arch
                          for asset in seal.assets.values())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"available={str(supported).lower()}\n")
          if not supported:
              message = f"{seal.tag} has no {sys.platform}/{arch} asset; browser steps are skipped."
              print(f"::notice::{message}")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(message + "\n")
          PY

      - name: Fetch the sealed binary
        if: steps.platform.outputs.available == 'true'
        shell: pwsh
        run: |
          $fetchOutput = @(python -m invisible_playwright fetch)
          $fetchExit = $LASTEXITCODE
          $fetchOutput | ForEach-Object { Write-Host $_ }
          if ($fetchExit -ne 0) {
              exit $fetchExit
          }
          $ffPath = [string]($fetchOutput | Select-Object -Last 1)
          $ffPath = $ffPath.Trim()
          if (-not $ffPath -or -not (Test-Path $ffPath)) {
              Write-Error "fetch reported no firefox.exe at '$ffPath'"
              exit 1
          }
          "FF_PATH=$ffPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify firefox.exe can launch standalone
        if: steps.platform.outputs.available == 'true'
        shell: pwsh
        run: |
          # CARRY the path from fetch, never rebuild it. The cache directory is
          # keyed on tag + base version + BuildID, so any string assembled here
          # is a second copy of a naming rule that has already moved once - and
          # when it drifts the step fails with NOT FOUND, indistinguishable from
          # the launch bug this job exists to detect.
          $ffPath = $env:FF_PATH
          Write-Host "Package reports: $ffPath"
          if (-not $ffPath -or -not (Test-Path $ffPath)) {
              Write-Error "firefox.exe NOT FOUND at '$ffPath' (reported by fetch)"
              exit 1
          }
          Write-Host "Launching: $ffPath --version"
          # NOTE: firefox.exe --version on Windows prints the version but may
          # return non-zero exit code (sub-process fork quirk). Check stdout.
          $output = & $ffPath --version 2>&1 | Out-String
          Write-Host "Output: $output"
          if ($output -notmatch 'Mozilla Firefox \d') {
              Write-Error "firefox.exe --version did not print a Mozilla Firefox version. Output was: $output"
              exit 1
          }
          Write-Host "OK: firefox.exe runs and prints version."

      - name: Run reporter's exact InvisiblePlaywright snippet
        if: steps.platform.outputs.available == 'true'
        run: |
          python -c "
          import asyncio
          from invisible_playwright.async_api import InvisiblePlaywright
          async def main():
              async with InvisiblePlaywright(seed=9128) as browser:
                  page = await browser.new_page()
                  await page.goto('about:blank')
                  print('OK: page loaded, url =', page.url)
          asyncio.run(main())
          "

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launch-failure-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ env.FF_PATH }}
          if-no-files-found: warn
          retention-days: 7
